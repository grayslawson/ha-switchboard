name: Validate Home Assistant metadata

on:
  push:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "repository.yaml"
      - "README.md"
      - "docs/**"
      - ".forgejo/workflows/**"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "repository.yaml"
      - "README.md"
      - "docs/**"
      - ".forgejo/workflows/**"
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ha-switchboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v podman
          podman --version
          podman info
      - name: Validate Home Assistant metadata
        run: podman run --rm --workdir /github/workspace --volume "$PWD:/github/workspace:ro" ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4
