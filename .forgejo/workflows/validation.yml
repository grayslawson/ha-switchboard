name: Validate Home Assistant metadata

on:
  push:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "repository.yaml"
      - "README.md"
      - "docs/**"
      - ".forgejo/workflows/**"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "repository.yaml"
      - "README.md"
      - "docs/**"
      - ".forgejo/workflows/**"
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ha-switchboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v podman
          command -v python3
          podman --version
          podman info
      - name: Export and validate public tree
        run: |
          set -euo pipefail
          python3 tools/ha-switchboard-export-public.py "$RUNNER_TEMP/public"
          python3 "$RUNNER_TEMP/public/tools/check_release_boundary.py" --root "$RUNNER_TEMP/public"
          test ! -e "$RUNNER_TEMP/public/.forgejo"
          test ! -e "$RUNNER_TEMP/public/.github"
      - name: Validate Home Assistant metadata
        run: podman run --rm --workdir /github/workspace --volume "$RUNNER_TEMP/public:/github/workspace:ro" ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4
