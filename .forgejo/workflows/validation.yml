name: Validate Home Assistant metadata

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ha-switchboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Home Assistant metadata
        run: |
          set -euo pipefail
          podman run --rm \
            --workdir /github/workspace \
            --volume "$PWD:/github/workspace:ro" \
            ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4

  hacs:
    name: HACS validation
    runs-on: ha-switchboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public integration with HACS
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_MIRROR_TOKEN"
          export INPUT_GITHUB_TOKEN="$GH_MIRROR_TOKEN"
          podman run --rm \
            --env INPUT_GITHUB_TOKEN \
            --env REPOSITORY=grayslawson/ha-switchboard \
            --env CATEGORY=integration \
            --env REPOSITORY_REF=master \
            --env GITHUB_WORKSPACE=/github/workspace \
            --volume "$PWD:/github/workspace:ro" \
            ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
          unset INPUT_GITHUB_TOKEN
