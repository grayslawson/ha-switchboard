name: Build and publish Home Assistant App

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "app/**"
      - "custom_components/**"
      - "standalone/**"
      - "pyproject.toml"
      - "hacs.json"
      - "repository.yaml"
      - "docs/RELEASE.md"
      - ".forgejo/workflows/build-app.yml"
      - ".forgejo/workflows/mirror-public.yml"
      - "tests/test_release_boundary.py"
      - "tests/test_ghcr_revision_gate.py"
      - "tools/check_release_boundary.py"
      - "tools/ha-switchboard-scan.py"
      - "tools/ha-switchboard-export-public.py"
      - "tools/app-image-smoke.sh"
      - "tools/app-image-e2e.sh"
      - "tools/verify-ghcr-image.py"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/grayslawson/ha-switchboard

concurrency:
  group: app-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish multi-architecture App image
    runs-on: ha-switchboard
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          # Release verification needs the complete tag history. The explicit
          # master fetch below is still required because checkout does not
          # necessarily create refs/remotes/origin/master for a tag event.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is an ancestor of protected master
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test "$ref_type" = tag
          test -n "$ref_name"
          test "$ref_name" = "v${ref_name#v}"
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "refs/tags/$ref_name^{commit}")"
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$source_revision"
          test "$source_revision" = "$(git rev-parse 'HEAD^{commit}')"
          test "$tag_commit" = "$source_revision"
          master_ref=refs/remotes/origin/master
          master_commit="$(git rev-parse "$master_ref^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$master_ref"
          echo "release tag $ref_name ($source_revision) is on protected master ($master_commit)"

      - name: Verify release source versions are consistent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          config = (root / "app/config.yaml").read_text(encoding="utf-8")
          package = (root / "app/ha_switchboard/__init__.py").read_text(encoding="utf-8")
          dockerfile = (root / "app/Dockerfile").read_text(encoding="utf-8")
          manifest = json.loads((root / "custom_components/ha_switchboard/manifest.json").read_text(encoding="utf-8"))
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          values = {
              "app/config.yaml": re.search(r"^version:\s*[\"']?([^\"'\s]+)", config, re.MULTILINE).group(1),
              "app/ha_switchboard/__init__.py": re.search(r"^__version__\s*=\s*[\"']([^\"']+)[\"']", package, re.MULTILINE).group(1),
              "app/Dockerfile": re.search(r"^ARG BUILD_VERSION=([^\s]+)", dockerfile, re.MULTILINE).group(1),
              "custom_components/ha_switchboard/manifest.json": manifest["version"],
              "pyproject.toml": project["project"]["version"],
          }
          if len(set(values.values())) != 1:
              raise SystemExit("release source version mismatch: " + ", ".join(f"{path}={value}" for path, value in values.items()))
          version = next(iter(values.values()))
          changelog = (root / "app/CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} — source release candidate (not published)"
          if marker not in changelog:
              raise SystemExit(f"app/CHANGELOG.md is missing release marker: {marker}")
          print(f"release source version consistent: {version}; app/CHANGELOG.md is authoritative")
          PY

      - name: Verify builder prerequisites
        run: |
          set -eu
          runner_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          test -d "$runner_home"
          command -v podman
          command -v python3
          command -v curl
          python3 --version
          podman --version
          podman info
          podman manifest --help >/dev/null

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *"\?\([0-9][0-9.]*\)"\?$/\1/p' app/config.yaml)"
          test -n "$version"
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-branch}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          if [[ "$ref_type" == "tag" ]]; then
            test "${ref_name#v}" = "$version"
          fi
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$source_revision"
          printf 'value=%s\n' "$version" >> "$FORGEJO_OUTPUT"
          printf 'revision=%s\n' "$source_revision" >> "$FORGEJO_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: grayslawson
          GHCR_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          set -eu
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Build amd64 and arm64 images
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -eu
          manifest="localhost/ha-switchboard:${VERSION}"
          podman manifest rm "$manifest" >/dev/null 2>&1 || true
          podman manifest create "$manifest"
          for arch in amd64 arm64; do
            hass_arch="$arch"
            if [[ "$arch" == arm64 ]]; then
              hass_arch=aarch64
            fi
            podman build \
              --platform "linux/${arch}" \
              --manifest "$manifest" \
              --build-arg "BUILD_VERSION=${VERSION}" \
              --build-arg "BUILD_ARCH=${hass_arch}" \
              --build-arg "BUILD_REVISION=${REVISION}" \
              app
          done

      - name: Run bounded App image E2E before versioned image publication
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout
          timeout --kill-after=10s 300s bash tools/app-image-e2e.sh

      - name: Push versioned multi-architecture image
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          podman manifest push --all \
            "localhost/ha-switchboard:${VERSION}" \
            "docker://${IMAGE}:${VERSION}"

      - name: Push latest multi-architecture image from master
        if: ${{ forgejo.ref == 'refs/heads/master' }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          podman manifest push --all \
            "localhost/ha-switchboard:${VERSION}" \
            "docker://${IMAGE}:latest"

      - name: Verify published multi-architecture image
        env:
          GHCR_USERNAME: grayslawson
          GHCR_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          REVISION: ${{ steps.version.outputs.revision }}
        run: |
          set -euo pipefail
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-branch}}"
          if [ "$ref_type" = "tag" ]; then
            published_tag="$VERSION"
          else
            published_tag=latest
          fi
          # GHCR may expose the index before all child manifests and the
          # config blob are readable. Keep this bounded, but give the registry
          # a full two minutes to complete immutable publication.
          for attempt in {1..12}; do
            if python3 tools/verify-ghcr-image.py \
              --image "${IMAGE}" \
              --tag "$published_tag" \
              --source-url "https://github.com/grayslawson/ha-switchboard" \
              --revision "$REVISION" \
              2>"$RUNNER_TEMP/ghcr-publish-verify-error.log"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "published multi-architecture image did not become readable within 120 seconds" >&2
              tail -n 4 "$RUNNER_TEMP/ghcr-publish-verify-error.log" >&2
              exit 1
            fi
            sleep 10
          done
