name: Publish sanitized GitHub mirror

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "app/**"
      - "custom_components/**"
      - "standalone/**"
      - "tests/**"
      - "tools/check_release_boundary.py"
      - "tools/ha-switchboard-scan.py"
      - "tools/verify-ghcr-image.py"
      - "docs/RELEASE.md"
      - "README.md"
      - "LICENSE"
      - "hacs.json"
      - "pyproject.toml"
      - "repository.yaml"
      - ".forgejo/workflows/mirror-public.yml"
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ secrets.GH_MIRROR_TOKEN != '' }}
    runs-on: ha-switchboard
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          # Keep tag ancestry available; fetch the protected master ref
          # explicitly below because tag checkouts may omit remote branches.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is an ancestor of protected master
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test "$ref_type" = tag
          test -n "$ref_name"
          test "$ref_name" = "v${ref_name#v}"
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "refs/tags/$ref_name^{commit}")"
          master_ref=refs/remotes/origin/master
          master_commit="$(git rev-parse "$master_ref^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$master_ref"
          echo "release tag $ref_name ($tag_commit) is on protected master ($master_commit)"
      - name: Verify release source versions are consistent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          config = (root / "app/config.yaml").read_text(encoding="utf-8")
          package = (root / "app/ha_switchboard/__init__.py").read_text(encoding="utf-8")
          dockerfile = (root / "app/Dockerfile").read_text(encoding="utf-8")
          manifest = json.loads((root / "custom_components/ha_switchboard/manifest.json").read_text(encoding="utf-8"))
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          values = {
              "app/config.yaml": re.search(r"^version:\s*[\"']?([^\"'\s]+)", config, re.MULTILINE).group(1),
              "app/ha_switchboard/__init__.py": re.search(r"^__version__\s*=\s*[\"']([^\"']+)[\"']", package, re.MULTILINE).group(1),
              "app/Dockerfile": re.search(r"^ARG BUILD_VERSION=([^\s]+)", dockerfile, re.MULTILINE).group(1),
              "custom_components/ha_switchboard/manifest.json": manifest["version"],
              "pyproject.toml": project["project"]["version"],
          }
          if len(set(values.values())) != 1:
              raise SystemExit("release source version mismatch: " + ", ".join(f"{path}={value}" for path, value in values.items()))
          print(f"release source version consistent: {next(iter(values.values()))}")
          PY
      - name: Export allowlisted public tree
        run: |
          python3 tools/ha-switchboard-export-public.py "$RUNNER_TEMP/public"
          python3 "$RUNNER_TEMP/public/tools/check_release_boundary.py" --root "$RUNNER_TEMP/public"
      - name: Gate release on matching multi-architecture App image
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GHCR_USERNAME: grayslawson
          GHCR_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *"\?\([0-9][0-9.]*\)"\?$/\1/p' app/config.yaml)"
          test -n "$version"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test "${ref_name#v}" = "$version"
          for attempt in {1..18}; do
            if python3 tools/verify-ghcr-image.py \
              --image ghcr.io/grayslawson/ha-switchboard \
              --tag "$version" \
              --source-url https://github.com/grayslawson/ha-switchboard \
              --revision "$GITHUB_SHA" \
              2>"$RUNNER_TEMP/ghcr-verify-error.log"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "matching App image was not published within 180 seconds" >&2
              tail -n 4 "$RUNNER_TEMP/ghcr-verify-error.log" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Push public master
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64 | tr -d '\n')"
          git -C "$RUNNER_TEMP/public" init --initial-branch=master
          git -C "$RUNNER_TEMP/public" config user.name "ha-switchboard mirror"
          git -C "$RUNNER_TEMP/public" config user.email "mirror@users.noreply.github.com"
          git -C "$RUNNER_TEMP/public" add --all
          git -C "$RUNNER_TEMP/public" commit -m "Mirror Forgejo ${GITHUB_SHA}"
          git -C "$RUNNER_TEMP/public" remote add github https://github.com/grayslawson/ha-switchboard.git
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            # A release tag is immutable. A rerun must not silently replace
            # the source revision behind an already published GitHub release.
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push github "HEAD:refs/tags/${GITHUB_REF_NAME}"
          else
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push --force github HEAD:master
          fi
      - name: Verify public mirror ref
        env:
          EXPECTED_REF_TYPE: ${{ forgejo.ref_type }}
          EXPECTED_REF_NAME: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          expected_sha="$(git -C "$RUNNER_TEMP/public" rev-parse HEAD)"
          if [ "$EXPECTED_REF_TYPE" = "tag" ]; then
            remote_ref="refs/tags/$EXPECTED_REF_NAME"
          else
            remote_ref="refs/heads/master"
          fi
          remote_sha="$(git ls-remote https://github.com/grayslawson/ha-switchboard.git "$remote_ref" | awk 'NR == 1 { print $1 }')"
          test -n "$remote_sha"
          test "$remote_sha" = "$expected_sha"
          echo "GitHub mirror verified: $remote_ref -> $remote_sha"
      - name: Create or update GitHub release from tag
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ["GH_MIRROR_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          base = "https://api.github.com/repos/grayslawson/ha-switchboard"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str, body: dict | None = None):
              payload = None if body is None else json.dumps(body).encode("utf-8")
              request = Request(url, data=payload, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          try:
              release = request("GET", f"{base}/releases/tags/{quote(tag, safe='')}")
          except HTTPError as error:
              if error.code != 404:
                  raise
              request(
                  "POST",
                  f"{base}/releases",
                  {"tag_name": tag, "name": tag, "generate_release_notes": True},
              )
              print(f"created GitHub release {tag}")
          else:
              print(f"GitHub release already exists: {release['html_url']}")
          PY
      - name: Verify GitHub release
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_MIRROR_TOKEN"]
          request = Request(
              f"https://api.github.com/repos/grayslawson/ha-switchboard/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              release = json.loads(response.read())
          assert release.get("tag_name") == tag, release
          assert release.get("draft") is False, release
          assert release.get("prerelease") is False, release
          print(f"GitHub release verified: {release['html_url']}")
          PY
