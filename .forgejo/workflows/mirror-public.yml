name: Publish sanitized GitHub mirror

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  mirror:
    if: ${{ secrets.GH_MIRROR_TOKEN != '' }}
    runs-on: ha-switchboard
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export allowlisted public tree
        run: |
          python3 tools/ha-switchboard-export-public.py "$RUNNER_TEMP/public"
          python3 "$RUNNER_TEMP/public/tools/check_release_boundary.py" --root "$RUNNER_TEMP/public"
      - name: Push public master
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64 | tr -d '\n')"
          git -C "$RUNNER_TEMP/public" init --initial-branch=master
          git -C "$RUNNER_TEMP/public" config user.name "ha-switchboard mirror"
          git -C "$RUNNER_TEMP/public" config user.email "mirror@users.noreply.github.com"
          git -C "$RUNNER_TEMP/public" add --all
          git -C "$RUNNER_TEMP/public" commit -m "Mirror Forgejo ${GITHUB_SHA}"
          git -C "$RUNNER_TEMP/public" remote add github https://github.com/grayslawson/ha-switchboard.git
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push --force github "HEAD:refs/tags/${GITHUB_REF_NAME}"
          else
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push --force github HEAD:master
          fi
      - name: Create or update GitHub release from tag
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ["GH_MIRROR_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          base = "https://api.github.com/repos/grayslawson/ha-switchboard"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str, body: dict | None = None):
              payload = None if body is None else json.dumps(body).encode("utf-8")
              request = Request(url, data=payload, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          try:
              release = request("GET", f"{base}/releases/tags/{quote(tag, safe='')}")
          except HTTPError as error:
              if error.code != 404:
                  raise
              request(
                  "POST",
                  f"{base}/releases",
                  {"tag_name": tag, "name": tag, "generate_release_notes": True},
              )
              print(f"created GitHub release {tag}")
          else:
              print(f"GitHub release already exists: {release['html_url']}")
          PY
