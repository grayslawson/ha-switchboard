name: Publish sanitized GitHub mirror

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "app/**"
      - "custom_components/**"
      - "standalone/**"
      - "tests/test_release_boundary.py"
      - "tests/test_ghcr_revision_gate.py"
      - "tools/check_release_boundary.py"
      - "tools/ha-switchboard-scan.py"
      - "tools/verify-ghcr-image.py"
      - "docs/RELEASE.md"
      - "README.md"
      - "LICENSE"
      - "hacs.json"
      - "pyproject.toml"
      - "repository.yaml"
      - ".forgejo/workflows/mirror-public.yml"
      - "tools/ha-switchboard-export-public.py"
      - "tools/app-image-smoke.sh"
      - "tools/app-image-e2e.sh"
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ secrets.GH_MIRROR_TOKEN != '' }}
    runs-on: ha-switchboard
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          # Keep tag ancestry available; fetch the protected master ref
          # explicitly below because tag checkouts may omit remote branches.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag is an ancestor of protected master
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test "$ref_type" = tag
          test -n "$ref_name"
          test "$ref_name" = "v${ref_name#v}"
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          tag_commit="$(git rev-parse "refs/tags/$ref_name^{commit}")"
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$source_revision"
          test "$source_revision" = "$(git rev-parse 'HEAD^{commit}')"
          test "$tag_commit" = "$source_revision"
          master_ref=refs/remotes/origin/master
          master_commit="$(git rev-parse "$master_ref^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$master_ref"
          echo "release tag $ref_name ($source_revision) is on protected master ($master_commit)"
      - name: Verify release source versions are consistent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          config = (root / "app/config.yaml").read_text(encoding="utf-8")
          package = (root / "app/ha_switchboard/__init__.py").read_text(encoding="utf-8")
          dockerfile = (root / "app/Dockerfile").read_text(encoding="utf-8")
          manifest = json.loads((root / "custom_components/ha_switchboard/manifest.json").read_text(encoding="utf-8"))
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          values = {
              "app/config.yaml": re.search(r"^version:\s*[\"']?([^\"'\s]+)", config, re.MULTILINE).group(1),
              "app/ha_switchboard/__init__.py": re.search(r"^__version__\s*=\s*[\"']([^\"']+)[\"']", package, re.MULTILINE).group(1),
              "app/Dockerfile": re.search(r"^ARG BUILD_VERSION=([^\s]+)", dockerfile, re.MULTILINE).group(1),
              "custom_components/ha_switchboard/manifest.json": manifest["version"],
              "pyproject.toml": project["project"]["version"],
          }
          if len(set(values.values())) != 1:
              raise SystemExit("release source version mismatch: " + ", ".join(f"{path}={value}" for path, value in values.items()))
          version = next(iter(values.values()))
          changelog = (root / "app/CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} — source release candidate (not published)"
          if marker not in changelog:
              raise SystemExit(f"app/CHANGELOG.md is missing release marker: {marker}")
          print(f"release source version consistent: {version}; app/CHANGELOG.md is authoritative")
          PY
      - name: Export allowlisted public tree
        run: |
          set -euo pipefail
          python3 tools/ha-switchboard-export-public.py "$RUNNER_TEMP/public"
          python3 "$RUNNER_TEMP/public/tools/check_release_boundary.py" --root "$RUNNER_TEMP/public"
          test -f "$RUNNER_TEMP/public/app/config.yaml"
          test -f "$RUNNER_TEMP/public/custom_components/ha_switchboard/manifest.json"
          test ! -e "$RUNNER_TEMP/public/.forgejo"
          test ! -e "$RUNNER_TEMP/public/.github"
      - name: Validate release workflows before publication
        run: |
          set -euo pipefail
          command -v actionlint
          actionlint -config-file .github/actionlint.yaml .forgejo/workflows/*.yml
      - name: Validate exported Core metadata with Hassfest
        run: |
          set -euo pipefail
          command -v podman
          podman run --rm --workdir /github/workspace \
            --volume "$RUNNER_TEMP/public:/github/workspace:ro" \
            ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4
      - name: Gate release on matching multi-architecture App image
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GHCR_USERNAME: grayslawson
          GHCR_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *"\?\([0-9][0-9.]*\)"\?$/\1/p' app/config.yaml)"
          test -n "$version"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test "${ref_name#v}" = "$version"
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$source_revision"
          # Build and mirror are independent triggers. GHCR can expose the
          # index before every immutable child manifest/config descriptor is
          # readable, so use one bounded two-minute handoff window.
          for attempt in {1..12}; do
            if python3 tools/verify-ghcr-image.py \
              --image ghcr.io/grayslawson/ha-switchboard \
              --tag "$version" \
              --source-url https://github.com/grayslawson/ha-switchboard \
              --revision "$source_revision" \
              2>"$RUNNER_TEMP/ghcr-verify-error.log"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "matching App image was not published within 120 seconds" >&2
              tail -n 4 "$RUNNER_TEMP/ghcr-verify-error.log" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Run bounded App image E2E gate before tag publication
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout
          timeout --kill-after=10s 300s bash tools/app-image-e2e.sh
      - name: Push public master
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-branch}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$ref_name"
          test -n "$source_revision"
          auth_header="$(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64 | tr -d '\n')"
          git -C "$RUNNER_TEMP/public" init --initial-branch=master
          git -C "$RUNNER_TEMP/public" config user.name "ha-switchboard mirror"
          git -C "$RUNNER_TEMP/public" config user.email "mirror@users.noreply.github.com"
          git -C "$RUNNER_TEMP/public" add --all
          git -C "$RUNNER_TEMP/public" commit -m "Mirror Forgejo ${source_revision}"
          git -C "$RUNNER_TEMP/public" remote add github https://github.com/grayslawson/ha-switchboard.git
          if [ "$ref_type" = "tag" ]; then
            # A release tag is immutable. A rerun must not silently replace
            # the source revision behind an already published GitHub release.
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push github "HEAD:refs/tags/${ref_name}"
          else
            git -C "$RUNNER_TEMP/public" -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push --force github HEAD:master
          fi
      - name: Verify public mirror ref
        env:
          EXPECTED_REF_TYPE: ${{ forgejo.ref_type }}
          EXPECTED_REF_NAME: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          expected_sha="$(git -C "$RUNNER_TEMP/public" rev-parse HEAD)"
          source_revision="${GITHUB_SHA:-}"
          if [ -z "$source_revision" ]; then
            source_revision="${FORGEJO_SHA:-}"
          fi
          test -n "$source_revision"
          test "$(git -C "$RUNNER_TEMP/public" show -s --format=%B HEAD)" = "Mirror Forgejo $source_revision"
          ref_type="${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-branch}}"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}"
          test -n "$ref_name"
          if [ "$ref_type" = "tag" ]; then
            remote_ref="refs/tags/$ref_name"
          else
            remote_ref="refs/heads/master"
          fi
          remote_sha="$(git ls-remote https://github.com/grayslawson/ha-switchboard.git "$remote_ref" | awk 'NR == 1 { print $1 }')"
          test -n "$remote_sha"
          test "$remote_sha" = "$expected_sha"
          echo "GitHub mirror verified: $remote_ref -> $remote_sha"
      - name: Validate published Core metadata with HACS
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_MIRROR_TOKEN"
          export INPUT_GITHUB_TOKEN="$GH_MIRROR_TOKEN"
          ref_name="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-master}}"
          if [ "${FORGEJO_REF_TYPE:-${GITHUB_REF_TYPE:-branch}}" != tag ]; then
            ref_name=master
          fi
          podman run --rm \
            --env INPUT_GITHUB_TOKEN \
            --env REPOSITORY=grayslawson/ha-switchboard \
            --env CATEGORY=integration \
            --env REPOSITORY_REF="$ref_name" \
            --env GITHUB_WORKSPACE=/github/workspace \
            --volume "$RUNNER_TEMP/public:/github/workspace:ro" \
            ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
          unset INPUT_GITHUB_TOKEN
      - name: Build HACS release archive
        if: ${{ forgejo.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(os.environ["RUNNER_TEMP"]) / "public"
          source = root / "custom_components" / "ha_switchboard"
          asset = Path(os.environ["RUNNER_TEMP"]) / "ha_switchboard.zip"
          files = sorted(path for path in source.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("HACS release archive source is empty")
          with ZipFile(asset, "w", compression=ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(root).as_posix())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          print(f"built {asset.name}: files={len(files)} bytes={asset.stat().st_size} sha256={digest}")
          PY
          test -s "$RUNNER_TEMP/ha_switchboard.zip"
      - name: Create or update GitHub release from tag
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
          RELEASE_ASSET: ${{ runner.temp }}/ha_switchboard.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ["GH_MIRROR_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          asset_path = Path(os.environ["RELEASE_ASSET"])
          asset_name = "ha_switchboard.zip"
          base = "https://api.github.com/repos/grayslawson/ha-switchboard"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str, body: dict | None = None):
              payload = None if body is None else json.dumps(body).encode("utf-8")
              request = Request(url, data=payload, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          try:
              release = request("GET", f"{base}/releases/tags/{quote(tag, safe='')}")
          except HTTPError as error:
              if error.code != 404:
                  raise
              release = request(
                  "POST",
                  f"{base}/releases",
                  {"tag_name": tag, "name": tag, "generate_release_notes": True},
              )
              print(f"created GitHub release {tag}")
          else:
              print(f"GitHub release already exists: {release['html_url']}")

          if release.get("tag_name") != tag:
              raise SystemExit(f"GitHub release tag mismatch: {release.get('tag_name')!r}")
          expected_bytes = asset_path.read_bytes()
          expected_size = len(expected_bytes)
          expected_digest = "sha256:" + hashlib.sha256(expected_bytes).hexdigest()
          assets = request("GET", f"{base}/releases/{release['id']}/assets?per_page=100")
          existing = next((item for item in assets if item.get("name") == asset_name), None)
          if existing is not None:
              if existing.get("size") != expected_size:
                  raise SystemExit(
                      f"GitHub release asset size mismatch: {existing.get('size')} != {expected_size}"
                  )
              remote_digest = existing.get("digest")
              if remote_digest and remote_digest != expected_digest:
                  raise SystemExit(
                      f"GitHub release asset digest mismatch: {remote_digest} != {expected_digest}"
                  )
              print(f"GitHub release asset already verified: {asset_name} ({expected_size} bytes)")
          else:
              upload_url = release["upload_url"].split("{", 1)[0]
              upload_url = f"{upload_url}?name={quote(asset_name, safe='')}"
              upload_request = Request(
                  upload_url,
                  data=expected_bytes,
                  headers={
                      **headers,
                      "Content-Type": "application/zip",
                      "Content-Length": str(expected_size),
                  },
                  method="POST",
              )
              with urlopen(upload_request, timeout=60) as response:
                  uploaded = json.loads(response.read())
              if uploaded.get("name") != asset_name or uploaded.get("size") != expected_size:
                  raise SystemExit(f"GitHub release asset upload mismatch: {uploaded}")
              print(f"uploaded GitHub release asset: {asset_name} ({expected_size} bytes)")
          PY
      - name: Verify GitHub release
        if: ${{ forgejo.ref_type == 'tag' }}
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_MIRROR_TOKEN"]
          request = Request(
              f"https://api.github.com/repos/grayslawson/ha-switchboard/releases/tags/{tag}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              release = json.loads(response.read())
          assert release.get("tag_name") == tag, release
          assert release.get("draft") is False, release
          assert release.get("prerelease") is False, release
          assets = release.get("assets", [])
          asset = next((item for item in assets if item.get("name") == "ha_switchboard.zip"), None)
          assert asset is not None, assets
          assert asset.get("size", 0) > 0, asset
          print(f"GitHub release asset verified: {asset['name']} ({asset['size']} bytes)")
          print(f"GitHub release verified: {release['html_url']}")
          PY
