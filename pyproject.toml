[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-switchboard"
version = "0.2.0"
description = "Portable Jev-backed decision gateway for Home Assistant"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["app"]
include = ["ha_switchboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "custom_components"]
addopts = "-ra"
markers = [
  "contract: provider, gateway, or integration contract tests",
  "feature: acceptance coverage for a user-visible Switchboard feature",
  "local_fixture: tests for the disposable Home Assistant fixture harness",
  "release: release-boundary and artifact evidence checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
