[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-switchboard"
version = "0.2.0"
description = "Portable Jev-backed decision gateway for Home Assistant"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "custom_components"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
