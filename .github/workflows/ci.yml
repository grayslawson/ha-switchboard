name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test tools
        run: python -m pip install --upgrade pytest
      - name: Compile Python
        run: python -m compileall app/ha_switchboard custom_components/ha_switchboard tools
      - name: Run tests
        run: pytest -q tests
      - name: Check release boundary
        run: python tools/check_release_boundary.py
      - name: Verify sanitized public tree
        run: |
          test ! -e .forgejo
          test ! -e docs/PUBLIC_REPOSITORY.md
          test ! -e tools/ha-switchboard-export-public.py
