name: "HA Switchboard"
version: "0.2.1"
slug: "ha_switchboard"
description: "Portable Jev-backed decision gateway for Home Assistant"
url: "https://github.com/grayslawson/ha-switchboard"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
image: "ghcr.io/grayslawson/ha-switchboard"
ingress: true
ingress_port: 8099
ingress_entry: "/"
ingress_stream: false
panel_icon: "mdi:robot-outline"
panel_title: "HA Switchboard"
panel_admin: true
apparmor: true
homeassistant_api: false
# Supervisor permits /addons/self/* and /discovery* with the scoped App token
# even when broad Supervisor API access is disabled.
hassio_api: true
discovery: [ha_switchboard]
host_network: false
privileged: []
devices: []
map: []
options:
  ingress_only: true
  gateway_mode: "adapter_only"
  jev_provider: "disabled"
  jev_model: "typesafe/jev-1.13"
  jev_api_key: ""
  fallback_provider: "disabled"
  fallback_model: ""
  fallback_api_key: ""
  gateway_token: ""
  profile_refresh_minutes: 15
  privacy_mode: "local_only"
schema:
  ingress_only: bool
  gateway_mode: "list(adapter_only)"
  jev_provider: "list(disabled|typesafe|openrouter|compatible)"
  jev_endpoint: "url?"
  jev_model: "str"
  jev_api_key: "password"
  fallback_provider: "list(disabled|openrouter|openai_compatible|typed_http)"
  fallback_endpoint: "url?"
  fallback_model: "str?"
  fallback_api_key: "password?"
  gateway_token: "password"
  profile_refresh_minutes: "int(1,1440)"
  privacy_mode: "list(local_only|jev_hosted_allowed|hosted_allowed)"
backup: hot
stage: experimental
