configuration:
  ingress_only:
    name: Restrict the Web UI to Home Assistant
    description: Keep this on for Home Assistant OS to declare the Supervisor-ingress UI mode. The dashboard/static UI requires ingress; direct Core/API calls use the gateway token.
  gateway_mode:
    name: Home Assistant connection mode
    description: Adapter only. The Core integration discovers devices and performs actions. Older supervisor_read_only settings are migrated automatically.
  jev_provider:
    name: Jev provider
    description: Select disabled, direct TypeSafe System One, OpenRouter Decisions, or a compatible typed Jev service. TypeSafe and OpenRouter have defaults; a compatible service needs its own endpoint.
  jev_endpoint:
    name: Jev decision URL
    description: Optional for TypeSafe or OpenRouter, which use their documented defaults. For a custom TypeSafe URL use its base or /v1/systemone; OpenRouter must use https://openrouter.ai/api/alpha/decisions; compatible services must return Switchboard's typed decision contract, not chat completions.
  jev_model:
    name: Jev model
    description: Use typesafe/jev-1.13 for OpenRouter Decisions; TypeSafe has its documented default unless overridden. A compatible typed Jev service may ignore this value.
  jev_api_key:
    name: Jev API key
    description: Key for the Jev decision service. For OpenRouter Jev, enter your OpenRouter API key. This is never a Home Assistant token.
  fallback_provider:
    name: Fallback provider
    description: Optional second route for requests Jev cannot complete. Disabled sends nothing; OpenRouter and OpenAI-compatible use the generic OpenAI-compatible chat-completions adapter; Typed HTTP requires a Switchboard-compatible handoff endpoint.
  fallback_endpoint:
    name: Fallback URL
    description: OpenRouter may be blank and uses its chat-completions URL; openai_compatible requires your provider base URL or full /chat/completions URL. Typed HTTP requires its compatible handoff URL.
  fallback_model:
    name: Fallback model
    description: Chat model ID sent to the OpenAI-compatible fallback. Required for both openrouter and openai_compatible; this is separate from the Jev model.
  fallback_api_key:
    name: Fallback API key
    description: Optional Bearer key for the fallback service when it requires authentication. Keep it separate from the Jev key; it may have the same value.
  gateway_token:
    name: Core-to-App token
    description: Long random token for direct Core/API calls. Enter the same value in the HA Switchboard integration; Supervisor ingress already authenticates the Web UI. This is not a model-provider key.
  profile_refresh_minutes:
    name: Full profile refresh interval
    description: Minutes for the Core worker's complete profile refresh loop. Scan now only requests a scan; wait for profile status active and no pending sections before control requests.
  privacy_mode:
    name: Where requests may be sent
    description: local_only blocks hosted Jev and hosted fallback; jev_hosted_allowed permits hosted Jev only; hosted_allowed also permits an explicitly configured hosted fallback.
